# One `docker compose up -d` starts all five stores.
# Credentials are local development values only; override them in .env.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PG_USER:-grocery}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-grocery_dev}
      POSTGRES_DB: ${PG_DB:-grocery}
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-grocery} -d ${PG_DB:-grocery}"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:8.2.12  # 8.0 fails on Linux kernel >= 6.19 (SERVER-121912)
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8.0
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-grocery_dev}
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]

volumes:
  pg_data:
  mongo_data:
  neo4j_data:
  qdrant_data:
